<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNOC Operations Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-color: #0d1117; --card-bg: #161b22; --text-main: #c9d1d9; --accent-blue: #58a6ff; --status-green: #238636; --border-color: #30363d; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        h2 { font-size: 18px; margin-top: 0; display: flex; align-items: center; gap: 10px; color: var(--accent-blue); }
        .announcement-item { padding: 15px; border-left: 4px solid var(--accent-blue); background: rgba(88, 166, 255, 0.1); margin-bottom: 15px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: var(--accent-blue); padding: 12px; border-bottom: 2px solid var(--border-color); }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .loading { text-align: center; padding: 20px; color: #8b949e; }
        .shift-tag { padding: 4px 10px; border-radius: 12px; font-size: 11px; color: white; font-weight: bold; text-transform: uppercase; }
        
        /* Search & Controls */
        .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .search-box { background: #0d1117; border: 1px solid var(--border-color); color: white; padding: 10px 15px; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 15px; outline: none; }
        .search-box:focus { border-color: var(--accent-blue); }
        button#refresh-btn { background: #21262d; color: var(--accent-blue); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: 0.3s; font-weight: 600; }
        button#refresh-btn:hover { background: #30363d; border-color: #8b949e; }
        #last-updated { font-size: 11px; color: #8b949e; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div style="font-size: 24px; font-weight: bold; color: var(--accent-blue);">
            <i class="fas fa-satellite-dish"></i> CNOC PORTAL
        </div>
        <div class="controls">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="current-date" style="color: #f0f6fc; font-weight: 500;"></div>
                <button onclick="fetchData()" id="refresh-btn">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
            <div id="last-updated">Waiting for first sync...</div>
        </div>
    </header>

    <div class="grid">
        <div class="card">
            <h2><i class="fas fa-bullhorn"></i> Announcements</h2>
            <div id="announcements-list" class="loading">Fetching updates...</div>
        </div>

        <div class="card">
            <h2><i class="fas fa-users-cog"></i> Today's Duty Roster</h2>
            <input type="text" id="rosterSearch" class="search-box" placeholder="🔍 Search personnel name..." onkeyup="filterRoster()">
            <div id="duty-table-container" class="loading">Loading schedule...</div>
        </div>
    </div>
</div>

<script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbwr22JJRWTp82w2wGAbJVp8gz_VUISmzsuLqoKvp7pgOS0eohXiHlKkhlF1OrOlggUX/exec";

    function getShiftColor(shift) {
        if (!shift || shift === 'RD') return '#444';
        if (shift.includes('6:00PM')) return '#6f42c1'; // Night
        if (shift.includes('6:00AM')) return '#2188ff'; // Day
        if (shift.includes('8:30AM')) return '#238636'; // Standard
        if (shift === 'ABSENT') return '#d73a49'; // Red
        return '#30363d';
    }

    async function fetchData() {
        const btn = document.getElementById('refresh-btn');
        const updateText = document.getElementById('last-updated');
        
        try {
            btn.innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> Updating...';
            btn.disabled = true;

            document.getElementById('current-date').innerText = new Date().toDateString();

            const [annRes, dutyRes] = await Promise.all([
                fetch(`${scriptURL}?type=announcements`),
                fetch(`${scriptURL}?type=duty`)
            ]);
            
            const announcements = await annRes.json();
            const dutyData = await dutyRes.json();

            // RENDER ANNOUNCEMENTS
            const annList = document.getElementById('announcements-list');
            annList.innerHTML = announcements.length ? announcements.map(a => `
                <div class="announcement-item">
                    <strong>${a.Title || 'Alert'}</strong><br>
                    <p style="margin:5px 0;">${a.Message || ''}</p>
                    <small style="color:#8b949e;">Posted by: ${a['Posted By'] || 'Admin'}</small>
                </div>
            `).join('') : "No active announcements.";

            // RENDER DUTY ROSTER
            const now = new Date();
            const todayDuty = dutyData.find(row => {
                const d = new Date(row.date);
                return d.toDateString() === now.toDateString();
            });

            const dutyContainer = document.getElementById('duty-table-container');
            if (!todayDuty) {
                dutyContainer.innerHTML = "No roster found for today.";
            } else {
                dutyContainer.innerHTML = `
                    <table id="rosterTable">
                        <thead><tr><th>Personnel</th><th>Status</th></tr></thead>
                        <tbody>
                            ${todayDuty.duty.map(p => `
                                <tr style="${p.shift === 'RD' ? 'opacity:0.5' : ''}">
                                    <td><strong>${p.name}</strong></td>
                                    <td><span class="shift-tag" style="background:${getShiftColor(p.shift)}">${p.shift || 'RD'}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>`;
            }
            
            // Update Timestamp
            const timeNow = new Date().toLocaleTimeString();
            updateText.innerText = "Last updated: " + timeNow;

        } catch (e) {
            console.error(e);
            updateText.innerText = "Sync failed at " + new Date().toLocaleTimeString();
        } finally {
            btn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh';
            btn.disabled = false;
        }
    }

    function filterRoster() {
        const input = document.getElementById("rosterSearch");
        const filter = input.value.toUpperCase();
        const table = document.getElementById("rosterTable");
        if (!table) return;
        const tr = table.getElementsByTagName("tr");

        for (let i = 1; i < tr.length; i++) {
            const td = tr[i].getElementsByTagName("td")[0];
            if (td) {
                const txtValue = td.textContent || td.innerText;
                tr[i].style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }
    }

    fetchData();
    setInterval(fetchData, 600000); // Auto-refresh every 10 mins
</script>

</body>
</html>
