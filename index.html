<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNOC Operations Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-color: #0d1117; --card-bg: #161b22; --text-main: #c9d1d9; --accent-blue: #58a6ff; --status-green: #238636; --border-color: #30363d; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 98%; margin: 0 auto; } 
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 25% 74%; gap: 20px; align-items: start; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; min-height: 500px; }
        .announcement-card { border-top: 4px solid var(--accent-blue); }
        h2 { font-size: 18px; margin-top: 0; display: flex; align-items: center; gap: 10px; color: var(--accent-blue); text-transform: uppercase; }
        .announcement-item { padding: 25px; border-left: 6px solid var(--accent-blue); background: rgba(88, 166, 255, 0.05); margin-bottom: 20px; border-radius: 8px; }
        .announcement-item strong { font-size: 22px; color: #fff; display: block; margin-bottom: 10px; }
        .announcement-item p { font-size: 16px; line-height: 1.6; color: #e6edf3; }
        
        /* Acknowledge UI */
        .seen-box { margin-top: 15px; display: flex; gap: 10px; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        select.seen-select { background: #0d1117; color: white; border: 1px solid var(--border-color); padding: 5px; border-radius: 4px; font-size: 12px; }
        button.ack-btn { background: var(--status-green); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .seen-list { font-size: 11px; color: #8b949e; margin-top: 8px; font-style: italic; }

        .summary-section { margin-bottom: 15px; padding: 12px; background: rgba(255, 255, 255, 0.03); border-radius: 6px; }
        .shift-header { color: var(--accent-blue); font-weight: bold; font-size: 13px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; padding-bottom: 4px; }
        .person-row { margin-bottom: 10px; padding-left: 5px; }
        .person-name { font-size: 13px; font-weight: bold; display: block; color: #fff; }
        .person-details { font-size: 11px; color: #8b949e; }
        .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        button#refresh-btn { background: #21262d; color: var(--accent-blue); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .duty-count-pill { background: var(--status-green); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div style="font-size: 26px; font-weight: bold; color: var(--accent-blue);">
                <i class="fas fa-satellite-dish"></i> CNOC PORTAL
            </div>
            <div id="duty-count-display"></div>
        </div>
        <div class="controls">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="current-date" style="color: #f0f6fc; font-weight: 500;"></div>
                <button onclick="fetchData()" id="refresh-btn"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
            <div id="last-updated">Waiting for sync...</div>
        </div>
    </header>

    <div class="grid">
        <div class="card">
            <h2><i class="fas fa-user-clock"></i> Duty Today</h2>
            <div id="duty-summary-container">Loading roster...</div>
        </div>

        <div class="card announcement-card">
            <h2><i class="fas fa-bullhorn"></i> Important Announcements</h2>
            <div id="announcements-list">Fetching updates...</div>
        </div>
    </div>
</div>

<script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbwfUgkKT-su76gIBe0dJ3jcVP8WR8FNQZv_4TwNoAG-QltpwaNJG8-mkzBQbsb4jaJj/exec";
    let staffNames = [];

    async function acknowledge(title, selectId) {
        const name = document.getElementById(selectId).value;
        if (!name) return alert("Please select your name.");
        
        try {
            const response = await fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ title: title, name: name })
            });
            fetchData(); // Refresh to show updated seen list
        } catch (e) { alert("Acknowledge failed."); }
    }

    async function fetchData() {
        const btn = document.getElementById('refresh-btn');
        try {
            btn.innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> Updating...';
            btn.disabled = true;
            document.getElementById('current-date').innerText = new Date().toDateString();

            const [annRes, dutyRes] = await Promise.all([
                fetch(`${scriptURL}?type=announcements`),
                fetch(`${scriptURL}?type=duty`)
            ]);
            
            const announcements = await annRes.json();
            const dutyData = await dutyRes.json();

            // Collect names for dropdown
            const now = new Date();
            const todayDuty = dutyData.find(row => new Date(row.date).toDateString() === now.toDateString());
            staffNames = todayDuty ? todayDuty.duty.map(p => p.name).sort() : [];

            // Render Announcements with Seen By UI
            document.getElementById('announcements-list').innerHTML = announcements.length ? announcements.map((a, idx) => {
                const selectId = `select-${idx}`;
                return `
                <div class="announcement-item">
                    <strong>${a.Title || 'Alert'}</strong>
                    <p>${a.Message || ''}</p>
                    <div class="seen-box">
                        <select id="${selectId}" class="seen-select">
                            <option value="">Acknowledge as...</option>
                            ${staffNames.map(name => `<option value="${name}">${name}</option>`).join('')}
                        </select>
                        <button class="ack-btn" onclick="acknowledge('${a.Title}', '${selectId}')">Acknowledge</button>
                    </div>
                    <div class="seen-list"><i class="fas fa-check-circle"></i> Seen by: ${a['Seen By'] || 'None yet'}</div>
                </div>`;
            }).join('') : "<p>No active announcements.</p>";

            // Process Duty Section
            if (todayDuty) {
                const groups = {};
                let activeCount = 0;
                todayDuty.duty.forEach(p => {
                    const shift = p.shift ? p.shift.trim() : "";
                    if (shift && shift !== "RD" && shift !== "ABSENT") {
                        activeCount++;
                        if (!groups[shift]) groups[shift] = [];
                        groups[shift].push(p);
                    }
                });
                document.getElementById('duty-count-display').innerHTML = `<span class="duty-count-pill">${activeCount} On Duty</span>`;
                
                const shiftOrder = ["6:00AM-6:00PM", "8:30AM-5:30PM", "7:00AM-4:00PM", "6:00PM-6:00AM"];
                const sortedShifts = Object.keys(groups).sort((a, b) => {
                    let idxA = shiftOrder.indexOf(a);
                    let idxB = shiftOrder.indexOf(b);
                    return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
                });

                document.getElementById('duty-summary-container').innerHTML = sortedShifts.map(shiftTime => `
                    <div class="summary-section">
                        <div class="shift-header"><i class="far fa-clock"></i> ${shiftTime}</div>
                        ${groups[shiftTime].map(p => `
                            <div class="person-row">
                                <span class="person-name">${p.name}</span>
                                <div class="person-details">${p.position || 'NOC'} | ${p.mobile || ''}</div>
                            </div>
                        `).join('')}
                    </div>`).join('');
            }
            document.getElementById('last-updated').innerText = "Last sync: " + new Date().toLocaleTimeString();
        } catch (e) { document.getElementById('duty-summary-container').innerHTML = "Sync Error."; }
        finally { btn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh'; btn.disabled = false; }
    }
    fetchData();
    setInterval(fetchData, 600000);
</script>
</body>
</html>
