<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNOC Operations Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-color: #0d1117; --card-bg: #161b22; --text-main: #c9d1d9; --accent-blue: #58a6ff; --status-green: #238636; --border-color: #30363d; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        h2 { font-size: 18px; margin-top: 0; display: flex; align-items: center; gap: 10px; color: var(--accent-blue); }
        .announcement-item { padding: 15px; border-left: 4px solid var(--accent-blue); background: rgba(88, 166, 255, 0.1); margin-bottom: 15px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: var(--accent-blue); padding: 12px; border-bottom: 2px solid var(--border-color); }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .loading { text-align: center; padding: 20px; color: #8b949e; }
        .shift-tag { background: #30363d; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div style="font-size: 24px; font-weight: bold; color: var(--accent-blue);">
            <i class="fas fa-satellite-dish"></i> CNOC PORTAL
        </div>
        <div id="current-date" style="color: #8b949e;"></div>
    </header>

    <div class="grid">
        <div>
            <div class="card">
                <h2><i class="fas fa-bullhorn"></i> Announcements</h2>
                <div id="announcements-list" class="loading">Fetching updates...</div>
            </div>
        </div>

        <div>
            <div class="card">
                <h2><i class="fas fa-users-cog"></i> Today's Duty Roster</h2>
                <div id="duty-table-container" class="loading">Loading schedule...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const scriptURL = "https://script.google.com/a/macros/unitydigitalinfra.com/s/AKfycbxMMhG9lgn8guhi2NaupRclahAUJynpSl9tGUbv27EskrNuFtjzOKIAk5AhoWz0d2iQQw/exec";

    async function fetchData() {
        try {
            // Set Today's Date in Header
            const now = new Date();
            document.getElementById('current-date').innerText = now.toDateString();

            // 1. Fetch Announcements
            const annRes = await fetch(`${scriptURL}?type=announcements`);
            const announcements = await annRes.json();
            const annList = document.getElementById('announcements-list');
            
            if (announcements.length === 0) {
                annList.innerHTML = "No active announcements.";
            } else {
                annList.innerHTML = announcements.map(a => `
                    <div class="announcement-item">
                        <strong>${a.Title || 'No Title'}</strong><br>
                        <p style="margin: 5px 0;">${a.Message || ''}</p>
                        <small style="color: #8b949e;">Posted by: ${a['Posted By'] || 'Admin'}</small>
                    </div>
                `).join('');
            }

            // 2. Fetch Duty Matrix
            const dutyRes = await fetch(`${scriptURL}?type=duty`);
            const dutyData = await dutyRes.json();
            const dutyContainer = document.getElementById('duty-table-container');

            // Find matching date row
            const todayStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            // Note: Adjusting for the Sheet's specific date format "Jan 1, 2026"
            const todayDuty = dutyData.find(row => {
                const d = new Date(row.date);
                return d.toDateString() === now.toDateString();
            });

            if (!todayDuty) {
                dutyContainer.innerHTML = "No roster found for today.";
            } else {
                dutyContainer.innerHTML = `
                    <table>
                        <thead><tr><th>Personnel</th><th>Shift / Status</th></tr></thead>
                        <tbody>
                            ${todayDuty.duty.map(person => `
                                <tr>
                                    <td><strong>${person.name}</strong></td>
                                    <td><span class="shift-tag">${person.shift || 'RD'}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }

        } catch (e) {
            console.error(e);
            document.getElementById('announcements-list').innerHTML = "Error loading data.";
            document.getElementById('duty-table-container').innerHTML = "Check App Script permissions.";
        }
    }

    fetchData();
<script>

    // 1. PASTE YOUR NEW URL HERE

    const scriptURL = "https://script.google.com/a/macros/unitydigitalinfra.com/s/AKfycbxMMhG9lgn8guhi2NaupRclahAUJynpSl9tGUbv27EskrNuFtjzOKIAk5AhoWz0d2iQQw/exec";



    async function fetchData() {

        try {

            document.getElementById('current-date').innerText = new Date().toDateString();



            // Fetch Data

            const [annRes, dutyRes] = await Promise.all([

                fetch(`${scriptURL}?type=announcements`),

                fetch(`${scriptURL}?type=duty`)

            ]);

            

            const announcements = await annRes.json();

            const dutyData = await dutyRes.json();



            // RENDER ANNOUNCEMENTS

            const annList = document.getElementById('announcements-list');

            annList.innerHTML = announcements.length ? announcements.map(a => `

                <div class="announcement-item">

                    <strong>${a.Title || 'Alert'}</strong><br>

                    <p style="margin:5px 0;">${a.Message || ''}</p>

                    <small style="color:#8b949e;">${a.Priority || 'Normal'} | ${a['Posted By'] || 'Admin'}</small>

                </div>

            `).join('') : "No active announcements.";



            // RENDER DUTY ROSTER

            const now = new Date();

            const todayDuty = dutyData.find(row => {

                const d = new Date(row.date);

                return d.toDateString() === now.toDateString();

            });



            const dutyContainer = document.getElementById('duty-table-container');

            if (!todayDuty) {

                dutyContainer.innerHTML = "No roster found for today.";

            } else {

                dutyContainer.innerHTML = `

                    <table>

                        <thead><tr><th>Personnel</th><th>Shift Status</th></tr></thead>

                        <tbody>

                            ${todayDuty.duty.map(p => `

                                <tr style="${p.shift === 'RD' || p.shift === 'ABSENT' ? 'opacity:0.5' : ''}">

                                    <td><strong>${p.name}</strong></td>

                                    <td><span class="shift-tag" style="background:${getShiftColor(p.shift)}">${p.shift}</span></td>

                                </tr>

                            `).join('')}

                        </tbody>

                    </table>`;

            }

        } catch (e) {

            document.getElementById('duty-table-container').innerHTML = "Connection Error. Check Permissions.";

        }

    }



    function getShiftColor(shift) {

        if (shift === 'RD') return '#444';

        if (shift.includes('6:00PM')) return '#6f42c1'; // Night

        if (shift.includes('6:00AM')) return '#2188ff'; // Day

        if (shift === 'ABSENT') return '#d73a49'; // Red

        return '#30363d';

    }



    fetchData();

</script>

</body>
</html>
