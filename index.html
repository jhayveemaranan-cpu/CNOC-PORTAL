<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNOC Operations Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-color: #0d1117; --card-bg: #161b22; --text-main: #c9d1d9; --accent-blue: #58a6ff; --status-green: #238636; --border-color: #30363d; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 98%; margin: 0 auto; } 
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 30px; }
        
        /* ADJUSTED GRID: 25% for Duty, 75% for Announcements */
        .grid { 
            display: grid; 
            grid-template-columns: 25% 74%; 
            gap: 20px; 
            align-items: start;
        }
        
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; min-height: 500px; }
        
        /* Specific styling for the Announcement Card to make it pop */
        .announcement-card { border-top: 4px solid var(--accent-blue); }
        
        h2 { font-size: 18px; margin-top: 0; display: flex; align-items: center; gap: 10px; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .announcement-item { 
            padding: 25px; 
            border-left: 6px solid var(--accent-blue); 
            background: rgba(88, 166, 255, 0.05); 
            margin-bottom: 20px; 
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .announcement-item:hover { background: rgba(88, 166, 255, 0.08); }
        .announcement-item strong { font-size: 22px; color: #fff; display: block; margin-bottom: 10px; }
        .announcement-item p { font-size: 16px; line-height: 1.6; margin: 10px 0; color: #e6edf3; }

        /* Duty Section Styling */
        .summary-section { margin-bottom: 15px; padding: 12px; background: rgba(255, 255, 255, 0.03); border-radius: 6px; }
        .shift-header { color: var(--accent-blue); font-weight: bold; font-size: 13px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; padding-bottom: 4px; }
        .person-row { margin-bottom: 10px; padding-left: 5px; }
        .person-name { font-size: 13px; font-weight: bold; display: block; color: #fff; }
        .person-details { font-size: 11px; color: #8b949e; }

        .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        button#refresh-btn { background: #21262d; color: var(--accent-blue); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button#refresh-btn:hover { background: #30363d; }
        #last-updated { font-size: 11px; color: #8b949e; }
        .duty-count-pill { background: var(--status-green); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        @media (max-width: 1024px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div style="font-size: 26px; font-weight: bold; color: var(--accent-blue);">
                <i class="fas fa-satellite-dish"></i> CNOC PORTAL
            </div>
            <div id="duty-count-display"></div>
        </div>
        <div class="controls">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="current-date" style="color: #f0f6fc; font-weight: 500;"></div>
                <button onclick="fetchData()" id="refresh-btn">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
            <div id="last-updated">Waiting for sync...</div>
        </div>
    </header>

    <div class="grid">
        <div class="card">
            <h2><i class="fas fa-user-clock"></i> Duty Today</h2>
            <div id="duty-summary-container">Loading roster...</div>
        </div>

        <div class="card announcement-card">
            <h2><i class="fas fa-bullhorn"></i> Important Announcements</h2>
            <div id="announcements-list">Fetching updates...</div>
        </div>
    </div>
</div>

<script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbwP1CuNuCsupZFw-wzcbbkgUSBiwjN9DYSmhxNpgOMF2bv5pvRmzLHrcg2aW4Mx0bio/exec";

    async function fetchData() {
        const btn = document.getElementById('refresh-btn');
        const updateText = document.getElementById('last-updated');
        const countDisplay = document.getElementById('duty-count-display');
        const summaryContainer = document.getElementById('duty-summary-container');
        
        try {
            btn.innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> Updating...';
            btn.disabled = true;
            document.getElementById('current-date').innerText = new Date().toDateString();

            const [annRes, dutyRes] = await Promise.all([
                fetch(`${scriptURL}?type=announcements`),
                fetch(`${scriptURL}?type=duty`)
            ]);
            
            const announcements = await annRes.json();
            const dutyData = await dutyRes.json();

            // Render Announcements
            document.getElementById('announcements-list').innerHTML = announcements.length ? announcements.map(a => `
                <div class="announcement-item">
                    <strong>${a.Title || 'Alert'}</strong>
                    <p>${a.Message || ''}</p>
                    <div style="margin-top:15px; font-size:12px; color:#8b949e; border-top:1px solid rgba(255,255,255,0.05); padding-top:10px;">
                        <i class="fas fa-user-edit"></i> Posted by: ${a['Posted By'] || 'Admin'}
                    </div>
                </div>
            `).join('') : "<p style='color:#8b949e;'>No active announcements at this time.</p>";

            // Process Duty Data
            const now = new Date();
            const todayDuty = dutyData.find(row => {
                const d = new Date(row.date);
                return d.toDateString() === now.toDateString();
            });

            if (!todayDuty) {
                summaryContainer.innerHTML = "No roster found for today.";
                countDisplay.innerHTML = "";
            } else {
                const groups = {};
                let activeCount = 0;

                todayDuty.duty.forEach(p => {
                    const shift = p.shift ? p.shift.trim() : "";
                    if (shift && shift !== "RD" && shift !== "ABSENT") {
                        activeCount++;
                        if (!groups[shift]) groups[shift] = [];
                        groups[shift].push(p);
                    }
                });

                countDisplay.innerHTML = `<span class="duty-count-pill">${activeCount} On Duty</span>`;
                
                const shiftOrder = ["6:00AM-6:00PM", "8:30AM-5:30PM", "7:00AM-4:00PM", "6:00PM-6:00AM"];
                const sortedShifts = Object.keys(groups).sort((a, b) => {
                    let idxA = shiftOrder.indexOf(a);
                    let idxB = shiftOrder.indexOf(b);
                    return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
                });

                summaryContainer.innerHTML = sortedShifts.map(shiftTime => `
                    <div class="summary-section">
                        <div class="shift-header"><i class="far fa-clock"></i> ${shiftTime}</div>
                        ${groups[shiftTime].map(p => `
                            <div class="person-row">
                                <span class="person-name">${p.name}</span>
                                <div class="person-details">${p.position || 'NOC'} | ${p.mobile || ''}</div>
                            </div>
                        `).join('')}
                    </div>
                `).join('');
            }
            
            updateText.innerText = "Last sync: " + new Date().toLocaleTimeString();
        } catch (e) {
            console.error(e);
            summaryContainer.innerHTML = "Sync Error.";
        } finally {
            btn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh';
            btn.disabled = false;
        }
    }

    fetchData();
    setInterval(fetchData, 600000); // Auto-refresh every 10 mins
</script>
</body>
</html>
